name: dev-esoft-practice

services:
  backend:
    container_name: dev_backend
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    environment:
      - NODE_ENV=development
      - TOKEN_LIFETIME_HOURS=${TOKEN_LIFETIME_HOURS}
      - JWT_SECRET=${JWT_SECRET}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - TASK_ANALYZER_URL=http://analyzer:8000
      - PORT=3333
    volumes:
      - ./backend/src:/app/src
    ports:
      - ${DEV_BACKEND_HOST_PORT:-3333}:3333
    healthcheck:
      test: [ "CMD-SHELL", "node -e \"require('http').get('http://localhost:3333', (r) => {r.statusCode < 500 ? process.exit(0) : process.exit(1)})\"" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 3s
    depends_on:
      postgres:
        condition: service_healthy
      analyzer:
        condition: service_started
    networks:
      backend_network:
      frontend_network:

  frontend:
    container_name: dev_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    ports:
      - ${DEV_FRONTEND_HOST_PORT:-5173}:5173
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    networks:
      frontend_network:

  postgres:
    container_name: dev_postgres
    build:
      context: ./database
      dockerfile: Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - ${DEV_DATABASE_HOST_PORT:-5432}:5432
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      backend_network:

  analyzer:
    build:
      context: ./task_analyzer_service
      dockerfile: python.Dockerfile
    container_name: dev_analyzer_service
    environment:
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - OLLAMA_URL=http://ollama:11434
      - ENVIRONMENT=development
    ports:
      - ${DEV_ANALYZER_HOST_PORT:-3000}:8000
    networks:
      backend_network:
    depends_on:
      ollama:
        condition: service_healthy

  ollama:
    build:
      context: ./task_analyzer_service
      dockerfile: ollama.Dockerfile
    container_name: dev_ollama
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_MODEL=${OLLAMA_MODEL}
    healthcheck:
      test: [ "CMD-SHELL", "ollama list | grep -q '${OLLAMA_MODEL}' || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 5s
    networks:
      backend_network:

volumes:
  postgres_data:
  ollama_models:
  caddy_data:

networks:
  backend_network:
    driver: bridge
  frontend_network:
    driver: bridge
