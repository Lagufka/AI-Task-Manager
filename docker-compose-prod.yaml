services:
  backend:
    container_name: backend
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    environment:
      - NODE_ENV=production
      - TOKEN_LIFETIME_HOURS=${TOKEN_LIFETIME_HOURS}
      - JWT_SECRET=${JWT_SECRET}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - TASK_ANALYZER_URL=http://analyzer:8000
      - PORT=3333
    healthcheck:
      test: [ "CMD-SHELL", "node -e \"require('http').get('http://localhost:3333', (r) => {r.statusCode < 500 ? process.exit(0) : process.exit(1)})\"" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 3s
    depends_on:
      postgres:
        condition: service_healthy
      analyzer:
        condition: service_started
    networks:
      backend_network:
      frontend_network:

  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    ports:
      - "80:80"
      - "443:443"
    environment:
      - VITE_API_URL=http://backend:3333
    volumes:
      - caddy_data:/data
    depends_on:
      backend:
        condition: service_healthy
    networks:
      frontend_network:

  postgres:
    container_name: postgres
    build:
      context: ./database
      dockerfile: Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      backend_network:

  analyzer:
    build:
      context: ./task_analyzer_service
      dockerfile: python.Dockerfile
    container_name: analyzer_service
    environment:
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - OLLAMA_URL=http://ollama:11434
      - ENVIRONMENT=production
    networks:
      backend_network:
    depends_on:
      ollama:
        condition: service_healthy

  ollama:
    build:
      context: ./task_analyzer_service
      dockerfile: ollama.Dockerfile
    container_name: ollama
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_MODEL=${OLLAMA_MODEL}
    healthcheck:
      test: [ "CMD-SHELL", "ollama list | grep -q '${OLLAMA_MODEL}' || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 5s
    networks:
      backend_network:

volumes:
  postgres_data:
  ollama_models:
  caddy_data:

networks:
  backend_network:
    driver: bridge
  frontend_network:
    driver: bridge
